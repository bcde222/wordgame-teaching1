<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英语抢答互动教学</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
body{background:#1a1a2e;color:#fff;padding:20px;margin:0;min-height:100vh}
.container{max-width:900px;margin:0 auto}
.card{background:#27293d;padding:24px;border-radius:12px;margin-bottom:20px}
button{padding:14px 24px;font-size:16px;margin:8px;background:#4a6cf7;color:white;border:none;border-radius:8px;cursor:pointer}
button:active{opacity:.8}
button:disabled{background:#666;cursor:not-allowed}
.red{background:#e53935}
.green{background:#28a745}
select{padding:12px;font-size:16px;border-radius:8px;background:#fff;color:#333}
#question{font-size:32px;font-weight:bold;margin:20px 0}
#status{font-size:26px;margin:10px 0}
#answer{font-size:28px;color:#ffab00;white-space:pre-line}
input{padding:14px;font-size:16px;border-radius:8px;border:none;width:100%;max-width:300px;margin:8px 0}
.hidden{display:none!important}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt-btn{padding:16px;font-size:18px;background:#333;border:2px solid #555;border-radius:10px;cursor:pointer;min-width:140px}
.opt-btn:active{background:#4a6cf7}
#stuStatus{font-size:20px;margin:10px 0;padding:12px;border-radius:8px}
.stu-correct{background:rgba(40,167,69,.3);color:#28a745}
.stu-wrong{background:rgba(229,57,53,.3);color:#e53935}
</style>
</head>
<body>

<!-- ========== 教师端 ========== -->
<div id="pageTeacher" class="container hidden">
<h1>🏆 英语抢答 - 教师端</h1>
<div class="card">
<p><strong>题型：</strong></p>
<select id="mode">
  <option value="en2cn">英译汉</option>
  <option value="cn2en">汉译英</option>
  <option value="fill">单词挖空填空</option>
</select>
<div class="btn-row" style="margin-top:12px">
  <button onclick="nextQuestion()" id="nextBtn">📝 下一题</button>
  <button onclick="resetRound()" class="red">🔄 重置本轮</button>
</div>
</div>
<div class="card">
<div id="question">点击下一题开始</div>
<div id="status">等待抢答...</div>
<div id="answer"></div>
</div>
</div>

<!-- ========== 学生端 ========== -->
<div id="pageStudent" class="container hidden">
<h1>🙋 英语抢答 - 学生端</h1>
<div class="card">
<p id="stuQuestion" style="font-size:28px;font-weight:bold;margin:16px 0">等待老师出题...</p>
<div id="stuOpts" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0"></div>
<input type="text" id="stuInput" placeholder="输入你的答案" class="hidden" style="max-width:250px;text-align:center">
<button onclick="stuBuzz()" id="buzzBtn" class="green" style="font-size:22px;padding:16px 40px">🔔 点击抢答</button>
<div id="stuStatus"></div>
</div>
</div>

<script>
// ===== 教师端逻辑 =====
const wordList = [
{en:"employee",cn:"雇员,员工"},{en:"social",cn:"社会的"},{en:"reputation",cn:"声誉"},
{en:"behavior",cn:"行为"},{en:"analyze",cn:"分析"},{en:"comfortable",cn:"舒适的"},
{en:"treatment",cn:"治疗"},{en:"security",cn:"安全"},{en:"professional",cn:"专业的"},
{en:"graduation",cn:"毕业"},{en:"tanker",cn:"油船"},{en:"submarine",cn:"潜艇"},
{en:"welding",cn:"焊接"},{en:"container",cn:"集装箱"}
];

let currentWord = null;
let correctPart = "";

function makeBlank(word){
  let mid = Math.floor(word.length/2);
  correctPart = word.substr(mid,3);
  return word.substr(0,mid)+"___"+word.substr(mid+3);
}

function nextQuestion(){
  localStorage.setItem("lock", "0");
  localStorage.setItem("raced", "0");
  localStorage.setItem("user", "");
  localStorage.setItem("result", "");
  localStorage.setItem("studentAnswer", "");
  currentWord = wordList[Math.floor(Math.random()*wordList.length)];
  const mode = document.getElementById("mode").value;
  let show = "";
  correctPart = "";
  if(mode==="en2cn") show = currentWord.en;
  else if(mode==="cn2en") show = currentWord.cn;
  else if(mode==="fill") show = makeBlank(currentWord.en);
  document.getElementById("question").innerText = show;
  document.getElementById("status").innerText = "等待抢答...";
  document.getElementById("answer").innerText = "";
  document.getElementById("nextBtn").disabled = true;
  localStorage.setItem("mode", mode);
  localStorage.setItem("q", show);
  localStorage.setItem("correctPart", correctPart);
  localStorage.setItem("answer", mode==="en2cn" ? currentWord.cn : currentWord.en);
  localStorage.setItem("tNewQ", Date.now().toString());
}

function resetRound(){
  localStorage.setItem("lock", "0");
  localStorage.setItem("raced", "0");
  localStorage.setItem("user", "");
  localStorage.setItem("result", "");
  localStorage.setItem("studentAnswer", "");
  document.getElementById("status").innerText = "已重置，可抢答";
  document.getElementById("answer").innerText = "";
}

// 教师监听
setInterval(()=>{
  const user = localStorage.getItem("user");
  const res = localStorage.getItem("result");
  const raced = localStorage.getItem("raced");
  const studentAnswer = localStorage.getItem("studentAnswer");
  const answer = localStorage.getItem("answer");
  if(raced==="1" && user && !res){
    document.getElementById("status").innerText = `🏆 ${user} 抢到了！`;
  }
  if(res){
    let msg = res==="correct" ? `🏆 ${user} ✅ 回答正确` : `🏆 ${user} ❌ 回答错误`;
    document.getElementById("status").innerText = msg;
    document.getElementById("answer").innerText = `学生答案：${studentAnswer || '未作答'}\n正确答案：${answer}`;
    document.getElementById("nextBtn").disabled = false;
  }
}, 300);

// ===== 学生端逻辑 =====
let stuName = "";
let stuRaced = false;
let lastQ = "";

function initStudent(){
  stuName = localStorage.getItem("stuName") || prompt("请输入你的名字：") || "学生";
  localStorage.setItem("stuName", stuName);
}

function stuBuzz(){
  const lock = localStorage.getItem("lock");
  if(lock==="1"){ alert("已被别人抢到，等待下一题"); return; }
  localStorage.setItem("lock", "1");
  localStorage.setItem("raced", "1");
  localStorage.setItem("user", stuName);
  stuRaced = true;
  document.getElementById("buzzBtn").disabled = true;
  document.getElementById("buzzBtn").innerText = "已抢到，请作答！";

  const mode = localStorage.getItem("mode");
  if(mode==="fill"){
    document.getElementById("stuInput").classList.remove("hidden");
    document.getElementById("stuInput").focus();
    document.getElementById("stuOpts").classList.add("hidden");
  }else{
    document.getElementById("stuInput").classList.add("hidden");
    document.getElementById("stuOpts").classList.remove("hidden");
  }
}

// 学生选择/提交
document.getElementById("stuInput").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ stuSubmit(document.getElementById("stuInput").value); }
});

function stuOptClick(val){
  stuSubmit(val);
}

function stuSubmit(val){
  if(!stuRaced) return;
  const answer = localStorage.getItem("answer") || "";
  const studentAnswer = val.trim();
  localStorage.setItem("studentAnswer", studentAnswer);

  const mode = localStorage.getItem("mode");
  let isCorrect = false;
  if(mode==="fill"){
    const correctPart = localStorage.getItem("correctPart") || "";
    isCorrect = studentAnswer.toLowerCase() === correctPart.toLowerCase();
  }else{
    const answers = answer.split(/[,，]/).map(s=>s.trim().toLowerCase());
    isCorrect = answers.includes(studentAnswer.toLowerCase());
  }

  localStorage.setItem("result", isCorrect ? "correct" : "wrong");

  const el = document.getElementById("stuStatus");
  if(isCorrect){
    el.className = "stu-correct";
    el.innerText = "✅ 回答正确！";
  }else{
    el.className = "stu-wrong";
    el.innerText = `❌ 回答错误！正确答案：${answer}`;
  }
  document.getElementById("buzzBtn").innerText = "等待下一题...";
  document.getElementById("stuInput").classList.add("hidden");
}

// 学生端轮询
setInterval(()=>{
  const newQ = localStorage.getItem("tNewQ") || "";
  if(newQ !== lastQ){
    lastQ = newQ;
    stuRaced = false;
    const q = localStorage.getItem("q") || "等待题目...";
    const mode = localStorage.getItem("mode") || "en2cn";

    document.getElementById("stuQuestion").innerText = q;
    document.getElementById("stuStatus").innerText = "";
    document.getElementById("stuStatus").className = "";
    document.getElementById("buzzBtn").disabled = false;
    document.getElementById("buzzBtn").innerText = "🔔 点击抢答";
    document.getElementById("stuInput").classList.add("hidden");
    document.getElementById("stuInput").value = "";

    // 生成选项
    if(mode==="en2cn" || mode==="cn2en"){
      const answer = localStorage.getItem("answer") || "";
      let opts = [answer];
      const pool = wordList.map(w=>mode==="en2cn"?w.cn:w.en);
      while(opts.length<4){
        const r = pool[Math.floor(Math.random()*pool.length)];
        if(!opts.includes(r)) opts.push(r);
      }
      opts.sort(()=>Math.random()-.5);
      document.getElementById("stuOpts").classList.remove("hidden");
      document.getElementById("stuOpts").innerHTML = opts.map(o=>
        `<button class="opt-btn" onclick="stuOptClick('${o.replace(/'/g,"\\'")}')">${o}</button>`
      ).join('');
    }else{
      document.getElementById("stuOpts").innerHTML = "";
    }
  }

  // 检查结果
  const res = localStorage.getItem("result");
  const raced = localStorage.getItem("raced");
  const user = localStorage.getItem("user");
  if(res && raced==="1" && user===stuName && !stuRaced){
    const el = document.getElementById("stuStatus");
    const answer = localStorage.getItem("answer") || "";
    if(res==="correct"){
      el.className = "stu-correct";
      el.innerText = "✅ 回答正确！";
    }else{
      el.className = "stu-wrong";
      el.innerText = `❌ 回答错误！正确答案：${answer}`;
    }
    document.getElementById("buzzBtn").innerText = "等待下一题...";
    document.getElementById("stuInput").classList.add("hidden");
  }
}, 300);

// ===== 角色切换 =====
(function(){
  const r = new URLSearchParams(location.search).get('role');
  if(r==='teacher'){
    document.getElementById('pageTeacher').classList.remove('hidden');
    document.getElementById('pageStudent').classList.add('hidden');
  }else if(r==='student'){
    document.getElementById('pageStudent').classList.remove('hidden');
    document.getElementById('pageTeacher').classList.add('hidden');
    initStudent();
  }else{
    // 首页选择
    document.getElementById('pageTeacher').classList.add('hidden');
    document.getElementById('pageStudent').classList.add('hidden');
    document.body.innerHTML = `
    <div class="container" style="text-align:center;padding-top:60px">
      <h1 style="font-size:2.2em;margin-bottom:10px">🏆 英语抢答互动教学</h1>
      <p style="color:#aaa;margin-bottom:36px">教师出题 · 学生抢答 · 实时互动 · 无需服务器</p>
      <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap">
        <div onclick="location.href='?role=teacher'" style="background:#27293d;padding:32px 28px;border-radius:16px;cursor:pointer;width:220px;border-top:4px solid #4a6cf7">
          <span style="font-size:48px;display:block;margin-bottom:12px">👩‍🏫</span>
          <h2>教师端</h2>
          <p style="color:#aaa;font-size:14px">出题 · 控制 · 查看抢答</p>
        </div>
        <div onclick="location.href='?role=student'" style="background:#27293d;padding:32px 28px;border-radius:16px;cursor:pointer;width:220px;border-top:4px solid #28a745">
          <span style="font-size:48px;display:block;margin-bottom:12px">🙋</span>
          <h2>学生端</h2>
          <p style="color:#aaa;font-size:14px">抢答 · 答题 · 查看结果</p>
        </div>
      </div>
    </div>`;
  }
})();
</script>
</body>
</html>
